<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genie of Choices</title>

<style>

/* 🌙 BACKGROUND */
body{
    .card{
    position: relative;
    z-index: 9999;
}
    html, body{
    position: relative;
    z-index: 0;
}
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at top, #1c2b2f, #0b0f10);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* 🧞 CARD */
.card{
    width:420px;
    background:rgba(255,255,255,0.08);
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

/* 🧞 TITLE */
h1{
    margin-bottom:10px;
    color:#ffd27a;
}

/* ✨ TEXT */
#question{
    font-size:18px;
    margin:20px 0;
}

/* 🔘 BUTTONS */
button{
    padding:10px 15px;
    margin:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.yes{ background:#4caf50; color:white; }
.no{ background:#f44336; color:white; }
.maybe{ background:#ff9800; color:white; }

#restart{
    display:none;
    background:#2196f3;
    color:white;
    margin-top:15px;
}

/* 🧞 SPARKLE EFFECT */
.sparkle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.7;
    animation: float 4s linear infinite;
}

@keyframes float{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-200px); opacity:0; }
}

</style>
</head>

<body>

<div class="card">
    <h1>🧞 Genie of Choices</h1>

    <p id="question">Are you ready to discover your fate?</p>

    <button class="yes" onclick="answer(1)">Yes</button>
    <button class="no" onclick="answer(0)">No</button>
    <button class="maybe" onclick="answer(0.5)">Maybe</button>

    <button id="restart" onclick="restart()">Try Again</button>
</div>

<script>

let step = 0;
let score = 0;

const questions = [
    "Do you enjoy being around people?",
    "Do you like planning things ahead?",
    "Do you trust your instincts more than logic?",
    "Do you like adventure and risk?",
    "Do you prefer leading over following?"
];

function answer(val){

    score += val;
    step++;

    if(step < questions.length){
        document.getElementById("question").innerText = questions[step];
    } else {
        showResult();
    }
}

/* 🧞 RESULT LOGIC */
function showResult(){

    let result = "";

    if(score >= 4){
        result = "🔥 You are a Natural Leader — bold, confident, unstoppable.";
    }
    else if(score >= 3){
        result = "🌊 You are a Dreamer — creative, emotional, intuitive.";
    }
    else if(score >= 2){
        result = "🌿 You are a Thinker — calm, logical, observant.";
    }
    else{
        result = "🌙 You are a Mystery — unpredictable and unique.";
    }

    document.getElementById("question").innerText = result;

    document.querySelectorAll("button").forEach(b=>{
        if(b.id !== "restart") b.style.display="none";
    });

    document.getElementById("restart").style.display="inline-block";
}

/* 🔁 RESET */
function restart(){
    step = 0;
    score = 0;

    document.getElementById("question").innerText = questions[0];

    document.querySelectorAll("button").forEach(b=>{
        if(b.id !== "restart") b.style.display="inline-block";
    });

    document.getElementById("restart").style.display="none";
}

/* ✨ RANDOM SPARKLES */
function createSparkle(){
    const s = document.createElement("div");
    s.classList.add("sparkle");

    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.top = window.innerHeight + "px";

    document.body.appendChild(s);

    setTimeout(()=> s.remove(), 4000);
}

setInterval(createSparkle, 300);

</script>

</body>
</html>
